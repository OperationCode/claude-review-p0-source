# Bad workflows, written as edits of the real files in .github/workflows.
#
# test_workflows.py copies the real directory, replaces the first occurrence of
# `old` with `new` in `file`, and requires the violation tags to equal `expect`
# exactly (a tag, or a list of tags).
# If `old` is no longer in the file, the test fails and the edit needs an update.

# --- pinning (every workflow) ---
- id: uses-tag
  file: claude-review.yml
  old: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
  new: "actions/checkout@v7"
  expect: unpinned-uses
- id: uses-short-sha
  file: claude-review.yml
  old: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
  new: "actions/upload-artifact@cf430e0"
  expect: unpinned-uses
- id: uses-local-action
  file: claude-review.yml
  old: "uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294"
  new: "uses: ./.github/actions/dependency-review"
  expect: [unpinned-uses, dependency-review]
- id: uses-local-action-eval
  file: eval.yml
  old: "uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"
  new: "uses: ./.github/actions/setup-uv"
  expect: unpinned-uses
- id: uses-docker
  file: eval.yml
  old: "uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"
  new: "uses: docker://ghcr.io/astral-sh/uv:0.13.1"
  expect: unpinned-uses
- id: uses-no-version-comment
  file: claude-review.yml
  old: " # v5.0.0, released 2026-05-08"
  new: ""
  expect: version-comment
- id: uses-flow-style
  file: test.yml
  old: "      - name: Check out this repo\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, released 2026-07-20\n        with:\n          persist-credentials: false\n"
  new: "      - {name: Check out this repo, uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: {persist-credentials: false}}\n"
  expect: version-comment
- id: actions-cache
  file: claude-review.yml
  old: "      - name: Collect the PR bundle\n"
  new: "      - name: Cache\n        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4\n        with:\n          path: ~/.cache/uv\n          key: uv\n      - name: Collect the PR bundle\n"
  expect: cache
